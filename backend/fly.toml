# fly.toml — Fly.io deployment config for RAPHA MEDICAL AI backend

app = "rapha-medical-ai-backend"   # Change this to your actual Fly.io app name
primary_region = "sin"             # Singapore (closest to Indonesia)

[build]
  dockerfile = "Dockerfile"

[env]
  APP_VERSION = "1.0.0"
  DEBUG = "false"
  REQUIRE_API_KEY = "false"   # Set to "true" when you want to monetize the API
  MODEL_NAME = "dummy-v0.1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 25

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/v1/health"
    port = 8000
    timeout = "5s"
    type = "http"
